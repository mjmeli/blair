services:
  blair:
    image: ${BLAIR_IMAGE:-ghcr.io/mjmeli/blair:latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      STORAGE_BACKEND: sqlite
      PORT: "8080"
      DISABLE_ANALYTICS: ${DISABLE_ANALYTICS:-true}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
